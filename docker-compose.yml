# Docker Compose configuration for backup-dash
#
# Deploy with: docker compose up -d on ryzen, from /srv/docker/backup-dash.
# The image reference uses your registry namespace (GitHub username/org for
# GHCR). For public packages no registry credentials are required on the host.
#
# Read-only invariant: every mount except /data is `:ro`, and the service has no
# write path. See the design note §"The read-only invariant".

services:
  app:
    image: ghcr.io/nickbrett1/backup-dash:latest
    container_name: backup-dash
    restart: unless-stopped

    # Credentials come from a file, never from the invocation shell. Without
    # this, `docker compose up -d` run in a shell where RESTIC_PASSWORD is not
    # exported silently starts the container with an empty password (the
    # environment block below would interpolate it to ""). See deploy/README.md.
    env_file:
      - /srv/.um790-backup/secrets/dashboard.env

    # Runs as root deliberately: /dagu/suspend on the host is drwxr-x--- root:root,
    # so a non-root UID cannot traverse it and would report "not suspended"
    # forever. The service holds no write path, and no-new-privileges blocks
    # setuid escalation. See the design note's mounting hazards.
    user: "0:0"
    security_opt:
      - no-new-privileges:true

    ports:
      - "3010:3000"
    volumes:
      - /srv/.um790-backup:/backup:ro
      - /srv/reader/docker/dagu/data/repo/dags/ryzen:/dagu/dags:ro
      - /srv/reader/docker/dagu/data/suspend:/dagu/suspend:ro
      - /srv/.um790-backup/secrets:/secrets:ro
      # /var/lib is root-owned on ryzen and `nick` has no NOPASSWD sudo, so the
      # writable history volume lives under /srv instead.
      - /srv/docker/backup-dash/data:/data
    environment:
      # Set your environment variables here or in a NAS-side .env file
      # (genproj never commits secrets). See .env.example.
      TZ: ${TZ:-America/New_York}
      PORT: ${PORT:-3000}
      STATE_FILE: ${STATE_FILE:-/backup/state/last_success.json}
      BACKUP_DIR: ${BACKUP_DIR:-/backup}
      RESTIC_REPO: ${RESTIC_REPO:-sftp:restic@192.168.1.2:/restic-target/um790}
      # RESTIC_PASSWORD is supplied by env_file above. Do NOT add it here: an
      # `environment:` entry takes precedence over env_file and would blank the
      # password whenever the invoking shell had not exported it.
      RESTIC_SSH_KEY: ${RESTIC_SSH_KEY:-/secrets/id_restic_ed25519}
      RESTIC_PORT: ${RESTIC_PORT:-2222}
      NAS_HOST: ${NAS_HOST:-192.168.1.2}
      NAS_PORT: ${NAS_PORT:-2222}
      NAS_SSH_KEY: ${NAS_SSH_KEY:-/secrets/id_nas_ed25519}
      NAS_USER: ${NAS_USER:-nick}
      NAS_SHARE: ${NAS_SHARE:-restic-target}
      DAG_FILE: ${DAG_FILE:-/dagu/dags/um790-backup.yaml}
      SUSPEND_FILE: ${SUSPEND_FILE:-/dagu/suspend/um790-backup}
      KNOWN_HOSTS: ${KNOWN_HOSTS:-/app/known_hosts}
      # Quoted: the * in the cron expression is a YAML alias otherwise.
      NEXT_RUN_CRON: "${NEXT_RUN_CRON:-30 3 * * *}"
      GRACE_MINUTES: ${GRACE_MINUTES:-180}
      CACHE_TTL_MS: ${CACHE_TTL_MS:-60000}
      HISTORY_PATH: ${HISTORY_PATH:-/data/history.jsonl}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Activity"
      - "homepage.name=Backup"
      - "homepage.description=restic backup, last success and repo size"
      - "homepage.href=http://ryzen:3010/"
      - "homepage.icon=mdi-backup-restore"
      # Suppress the CPU / memory / network row Homepage shows for every
      # docker-discovered service. The card should show the backup verdict, not
      # the dashboard container's own resource use.
      - "homepage.showStats=false"
      # iframe at /tile, not customapi. A service-level customapi widget is
      # resolved through /api/widgets/customapi?index=N, and that endpoint only
      # reads widgets.yaml — so it answers "Missing Custom API URL" for every
      # service-defined widget and the card falls back to the container's CPU/mem
      # row. The iframe renders options.src on the client with no lookup, which is
      # how the other Activity tiles work. /tile is built for it: verdict, age
      # bar and one line naming when the last good run happened and what it
      # carried. The layout drops the chrome for /tile* paths.
      - "homepage.widget.type=iframe"
      - "homepage.widget.src=http://ryzen:3010/tile"
      - "homepage.widget.classes=h-40 md:h-44"
