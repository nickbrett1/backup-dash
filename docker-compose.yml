# Docker Compose configuration for backup-dash
# Generated by genproj (docker-container capability).
#
# Deploy with: docker compose up -d
# (On Synology, import this file as a Container Manager "Project".)
#
# The image reference uses your registry namespace (GitHub username/org for
# GHCR). For public packages no registry credentials are required on the host.

services:
  app:
    image: ghcr.io/nickbrett1/backup-dash:latest
    container_name: backup-dash
    restart: unless-stopped

    ports:
      - "3010:3000"
    volumes:
      - /srv/.um790-backup:/backup:ro
      - /srv/reader/docker/dagu/data/repo/dags/ryzen:/dagu/dags:ro
      - /srv/reader/docker/dagu/data/suspend:/dagu/suspend:ro
      - /srv/.um790-backup/secrets:/secrets:ro
      - /var/lib/backup-dash:/data
    environment:
      # Set your environment variables here or in a NAS-side .env file
      # (genproj never commits secrets). See .env.example.
      TZ: ${TZ:-America/New_York}
      PORT: ${PORT:-3000}
      STATE_FILE: ${STATE_FILE:-/backup/state/last_success.json}
      BACKUP_DIR: ${BACKUP_DIR:-/backup}
      RESTIC_REPO: ${RESTIC_REPO:-sftp:restic@192.168.1.2:/restic-target/um790}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      RESTIC_SSH_KEY: ${RESTIC_SSH_KEY:-/secrets/id_restic_ed25519}
      NAS_HOST: ${NAS_HOST:-192.168.1.2}
      NAS_PORT: ${NAS_PORT:-2222}
      NAS_SSH_KEY: ${NAS_SSH_KEY:-/secrets/id_nas_ed25519}
      NAS_USER: ${NAS_USER:-nick}
      NAS_SHARE: ${NAS_SHARE:-restic-target}
      DAG_FILE: ${DAG_FILE:-/dagu/dags/um790-backup.yaml}
      SUSPEND_FILE: ${SUSPEND_FILE:-/dagu/suspend/um790-backup}
      NEXT_RUN_CRON: ${NEXT_RUN_CRON:-30 3 * * *}
      HISTORY_PATH: ${HISTORY_PATH:-/data/history.jsonl}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Services"
      - "homepage.name=backup-dash"
      - "homepage.href=http://ryzen:3010/"
      - "homepage.widget.type=customapi"
      - "homepage.widget.url=http://localhost:3010/health"
      - "homepage.widget.mappings[0].field=status"
      - "homepage.widget.mappings[0].label=Status"
