# Homepage services.yaml snippet for backup-dash
#
# Goes in the Activity group, not the default Services group
# (infra/um790/um790-phase-1-build-order-pt2.md). Append under `Activity:` in
# Homepage's services.yaml. The URL uses the published host port (3010) and the
# bare LAN name `ryzen`, which the viewing browser resolves.

- backup-dash:
    icon: sh-docker
    href: http://ryzen:3010/
    description: restic backup, last success and repo size
    siteMonitor: http://ryzen:3010/
    widget:
      type: customapi
      url: http://ryzen:3010/api/status
      refreshInterval: 60000
      mappings:
        - field: verdict
          label: Status
